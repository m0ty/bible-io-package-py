[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bible-io"
version = "1.1.1"
authors = [{ name = "Moty Fainer" }]
description = "Validated, edition-aware Bible content, navigation, references, and Unicode search"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
    "bible-io-references>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/m0ty/bible-io-package-py"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "mypy>=2.3.0",
  "build>=1.5.0",
  "coverage[toml]>=7.10",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "mypy>=2.3.0",
  "build>=1.5.0",
  "coverage[toml]>=7.10",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["bible_io"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 90

[tool.hatch.build.targets.wheel]
packages = ["src/bible_io"]

[tool.hatch.build.targets.wheel.force-include]
"src/bible_io/py.typed" = "bible_io/py.typed"

[tool.hatch.build.targets.sdist.force-include]
"src/bible_io/py.typed" = "src/bible_io/py.typed"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]
exclude = [
  "/.uv-cache",
  "/.venv",
  "/build",
  "/dist",
  "/test",
]
